[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akwapui-django"
version = "1.0.0"
description = "AkwapUI design system for Django: tokens, themes, component template tags and an accessible form renderer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
akwapui_django = ["icons.json", "templates/**/*", "static/**/*", "tailwind/*"]
