<{{ tag }} class="{{ classes }}"{{ attrs }}>
  {% if title %}<header class="ak-card-header"><div class="ak-card-heading"><{{ heading_tag }} class="ak-card-title">{{ title }}</{{ heading_tag }}>{% if subtitle %}<p class="ak-card-subtitle">{{ subtitle }}</p>{% endif %}</div></header>{% endif %}
  <div class="ak-card-body">{{ content }}</div>
</{{ tag }}>
