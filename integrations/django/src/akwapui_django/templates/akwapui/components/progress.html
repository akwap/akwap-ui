<div class="{{ classes }}"{{ attrs }}>
  {% if label or show_value %}<div class="ak-progress-head"><span>{{ label|default:"" }}</span>{% if show_value %}<span class="ak-progress-value">{{ value_text }}</span>{% endif %}</div>{% endif %}
  <div class="ak-progress-track" role="progressbar" aria-valuenow="{{ value|floatformat:'-2' }}" aria-valuemin="0" aria-valuemax="{{ max|floatformat:'-2' }}" aria-valuetext="{{ value_text }}"{% if label %} aria-label="{{ label }}"{% else %} aria-label="Progress"{% endif %}><div class="ak-progress-fill" style="width: {{ pct }}%"></div></div>
</div>
